<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Barbearia Popeye</title>
        <link rel="stylesheet" href="./scc/reset.css">
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <header>
            <div class="caixa">
                <h1><img src="logo.png"></h1>

                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="produtos.html">Produtos</a></li>
                        <li><a href="contato.html">Contato</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <form>
                <label for="nomesobrenome">Nome e Sobrenome</label>
                <input type="text" id="nomesobrenome" class="input-padrao" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" class="input-padrao" required placeholder="seuemail@dominio.com">

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" class="input-padrao" required placeholder="(XX) XXXX-XXXX">

                <label for="mensagem">Mensagem</label>
                <input cols="70" rows="10" id="mensagem" class="input-padrao" required>

                <fieldset>
                    <legend>Como prefere o nosso contato?</legend>
                    <label for="radio-email"><input type="radio" name="contato" 
                                   value="email" id="radio-email">Email</label>
                    <label for="radio-telefone"><input type="radio" name="contato" 
                                   value="telefone" id="radio-telefone">Telefone</label>
                    <label for="radio-whatsapp"><input type="radio" name="contato" 
                                   value="whatsapp" id="radio-whatsapp" checked>Whatsapp</label>
                </fieldset>

                <findset>
                    <legend>Qual horário prefere ser atendido?</legend>
                    <select>
                        <option>Manhã</option>
                        <option>Tarde</option>
                        <option>Noite</option>
                    </select>
                </findset>

                <label><input type="chackbox" class="checkbox" checked="">Gostaria de receber nossas novidades</label>


                <input type="submit" value="Enviar Fromulario" class="Enviar"
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Dia</th>
                        <th>Horario</th>
                    </tr>
                </thead>

                <body>
                    <tr>
                        <td>Segunda-feira</td>
                        <td>8h - 20h</td>
                    </tr>                    
                    <tr>
                        <td>terça-feira</td>
                        <td>8h - 20h</td>
                    </tr>                    
                    <tr>
                        <td>quarta-feira</td>
                        <td>8h - 20h</td>
                    </tr>                    
                    <tr>
                        <td>quinta-feira</td>
                        <td>8h - 20h</td>
                    </tr>                    
                    <tr>
                        <td>sexta-feira</td>
                        <td>8h - 20h</td>
                    </tr>                    
                    <tr>
                        <td>Sabado</td>
                        <td>12h - 15h</td>
                    </tr>
                </body>
            </table>
            <br>
            <p>Nao atendemos aos domingos e aos feriados</p>
        </main>
    </body>
</html>
